<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<body style="font:16px monospace;padding:16px;background:#111;color:#eee">
<div id="o">Test en cours…</div>
<script>
const o=document.getElementById('o');
const log=t=>o.innerHTML+='<br>'+t;
o.innerHTML='Adresse : '+location.href+'<br>Navigateur : '+navigator.userAgent+'<br>En ligne : '+navigator.onLine+'<br>';
const tests=['https://api.adsb.lol/v2/point/46/4/50','https://opendata.adsb.fi/api/v3/lat/46/lon/4/dist/50','https://api.airplanes.live/v2/point/46/4/50','https://opensky-network.org/api/states/all?lamin=45&lamax=47&lomin=3&lomax=5','https://api.github.com/zen'];
tests.forEach(async u=>{try{const r=await fetch(u);log('OK '+r.status+' '+u)}catch(e){log('ERREUR '+e.message+' '+u)}});
</script>
