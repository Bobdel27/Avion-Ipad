<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Radar avions</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="theme-color" content="#070b10">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Concept : poste de contrôle plein écran, carte à gauche, liste et fiche détaillée à droite */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f2f5f8; --line:#d6dde6; --fg:#101820; --muted:#5b6876;
  --accent:#0a7ea4; --accent-fg:#ffffff; --warn:#a86a00; --bad:#c62828; --good:#23813f; --mil:#b45309;
  --lbbg:rgba(255,255,255,.88); --map-bg:#dfe5ec; --shadow:0 6px 22px rgba(0,0,0,.18);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070b10; --panel:#0e151d; --panel2:#141d28; --line:#223040; --fg:#e6edf5; --muted:#8696a8;
    --accent:#4cc9f0; --accent-fg:#04222d; --warn:#ffb627; --bad:#ff5d5d; --good:#5fd38d; --mil:#ffb627;
    --lbbg:rgba(8,13,19,.82); --map-bg:#0b1118; --shadow:0 6px 22px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070b10; --panel:#0e151d; --panel2:#141d28; --line:#223040; --fg:#e6edf5; --muted:#8696a8;
  --accent:#4cc9f0; --accent-fg:#04222d; --warn:#ffb627; --bad:#ff5d5d; --good:#5fd38d; --mil:#ffb627;
  --lbbg:rgba(8,13,19,.82); --map-bg:#0b1118; --shadow:0 6px 22px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.35 var(--sans);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.shell{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Barre du haut */
.bar{display:flex;align-items:center;gap:14px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.brand svg{width:24px;height:24px;color:var(--accent)}
.brand b{font-size:17px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap}
.stats{display:flex;gap:8px;flex:1;min-width:0;overflow:hidden;flex-wrap:nowrap}
.st{font-family:var(--mono);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;white-space:nowrap;color:var(--muted)}
.st b{color:var(--fg);font-size:15px;margin-right:4px}
.st.alert{border-color:var(--bad);color:var(--bad)}
.st.alert b{color:var(--bad)}
.bar-r{display:flex;align-items:center;gap:8px;flex:none}
.clock{font-family:var(--mono);font-size:13px;text-align:right;line-height:1.2;color:var(--muted)}
.clock b{color:var(--fg);font-size:17px;font-weight:600}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.ib.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ib.sm{width:34px;height:34px;border-radius:9px}

/* Zone principale */
.work{display:grid;grid-template-columns:minmax(0,1fr) clamp(350px,38vw,470px);min-height:0}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#sweep{position:absolute;z-index:450;border-radius:50%;pointer-events:none;display:none;
  background:conic-gradient(from 0deg,rgba(76,201,240,0) 0deg,rgba(76,201,240,0) 270deg,rgba(76,201,240,.28) 358deg,rgba(76,201,240,.85) 360deg);
  animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#sweep{animation:none}}
#map{position:absolute;inset:0;background:var(--map-bg)}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.leaflet-container{font:inherit;background:var(--map-bg)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--fg)!important;border-bottom-color:var(--line)!important;width:38px!important;height:38px!important;line-height:38px!important;font-size:20px!important}
.ov{position:absolute;z-index:500;display:flex;gap:8px;pointer-events:none}
.ov>*{pointer-events:auto}
.ov-bl{left:12px;bottom:12px;flex-wrap:wrap;max-width:60%}
.ov-tr{right:12px;top:12px;flex-direction:column}
.ov-tc{left:60px;right:60px;top:10px;justify-content:center;flex-direction:column;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);font-weight:600}
.pill.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.legend{position:absolute;right:12px;bottom:12px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);width:190px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.legend i{display:block;height:8px;border-radius:4px;margin:4px 0}
.legend div{display:flex;justify-content:space-between}
.alertbox{display:flex;align-items:center;gap:10px;background:var(--bad);color:#fff;border-radius:12px;padding:8px 14px;box-shadow:var(--shadow);font-weight:600;max-width:100%;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.alertbox{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.72}}

/* Marqueurs */
.acm{background:none;border:0}
.pl{position:relative;width:34px;height:34px;display:grid;place-items:center;--c:#8a97a6}
.pl svg{width:26px;height:26px;fill:var(--c);stroke:rgba(0,0,0,.6);stroke-width:.9;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.5))}
.acm.gnd .pl svg{width:19px;height:19px;opacity:.8}
.acm.mil .pl svg{stroke:#ffd166;stroke-width:1.6}
.acm.sel .pl::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);background:rgba(76,201,240,.16)}
.acm.emg .pl::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid #ff3b30;background:rgba(255,59,48,.22)}
@media (prefers-reduced-motion:no-preference){.acm.emg .pl::before{animation:pulse 1s ease-in-out infinite}}
.lb{display:none;position:absolute;left:30px;top:50%;transform:translateY(-50%);white-space:nowrap;font:600 11px var(--mono);color:var(--fg);background:var(--lbbg);border-radius:5px;padding:1px 5px;pointer-events:none}
.labels .lb,.acm.sel .lb{display:block}
.apm span{position:absolute;transform:translate(-50%,-130%);font:700 12px var(--mono);color:var(--fg);background:var(--lbbg);border:1px solid var(--accent);border-radius:5px;padding:1px 6px;white-space:nowrap}
.home-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 3px rgba(76,201,240,.35)}

/* Panneau latéral */
.side{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-left:1px solid var(--line)}
.tools{display:grid;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tools .r1{display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:38px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;-webkit-user-select:text;user-select:text}
.sel{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.list{flex:1;min-height:120px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
.row.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.row.emg{box-shadow:inset 3px 0 0 var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;grid-row:1/3;align-self:center}
.r1{display:flex;align-items:baseline;gap:8px;min-width:0}
.r1 b{font-family:var(--mono);font-size:15px}
.r1 em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap}
.r2{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{grid-column:3;grid-row:1/3;text-align:right;font-family:var(--mono);display:grid;gap:1px}
.rv b{font-size:14px}
.rv small{color:var(--muted);font-size:11px}
.tag{display:inline-block;font:700 10px var(--mono);letter-spacing:.04em;border-radius:5px;padding:1px 5px;border:1px solid currentColor;vertical-align:1px}
.tag.mil{color:var(--mil)}.tag.bad{color:var(--bad)}.tag.mut{color:var(--muted)}.tag.acc{color:var(--accent)}
.empty{padding:24px 16px;color:var(--muted);text-align:center}

/* Fiche avion */
.detail{flex:0 1 auto;max-height:54%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-bottom:2px solid var(--accent);background:var(--panel);-webkit-user-select:text;user-select:text}
.dh{padding:10px 12px 6px;position:sticky;top:0;background:var(--panel);z-index:2}
.dh1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dcall{font:700 24px var(--mono);line-height:1.1}
.dsub{color:var(--muted);font-size:13px;margin-top:2px}
.dbtns{display:flex;gap:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sec{padding:8px 12px;border-top:1px solid var(--line)}
.sec h4{margin:0 0 6px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.photo{margin:0;padding:0}
.photo img{display:block;width:100%;max-height:170px;object-fit:cover;background:var(--panel2)}
.photo figcaption{font-size:11px;color:var(--muted);padding:3px 12px}
.rt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.ap{display:grid;gap:0}
.ap b{font:700 22px var(--mono)}
.ap span{font-size:12px;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap.r{text-align:right}.ap.r span{margin-left:auto}
.rtm small{display:block;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:6px}
.rbar{position:relative;height:4px;border-radius:2px;background:var(--line);margin:10px 0 0}
.rbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.rbar u{position:absolute;top:-8px;width:20px;height:20px;margin-left:-10px;color:var(--accent);text-decoration:none}
.rbar u svg{width:20px;height:20px;fill:currentColor;transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.kv{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.03em}
.kv b{font:600 14px var(--mono);overflow-wrap:anywhere}
.kv.w2{grid-column:span 2}
.kv.bad b{color:var(--bad)}.kv.good b{color:var(--good)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{color:var(--accent);font-weight:600;border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-decoration:none;background:var(--panel2)}
.prof svg{display:block;width:100%;height:76px}
.prof small{color:var(--muted);font:11px var(--mono)}
.note{color:var(--muted);font-size:12.5px}
.ac-msg{border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:6px;background:var(--panel2)}
.ac-msg header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 11px var(--mono);color:var(--muted);margin-bottom:3px}
.ac-msg pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.4 var(--mono)}
details{margin-top:6px}
details summary{cursor:pointer;color:var(--accent);font-size:12px}
details pre{font:11px var(--mono);white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto;background:var(--panel2);padding:6px;border-radius:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 12px;font-weight:600}
.btn.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* Pied de page */
.foot{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:5px 12px;background:var(--panel);border-top:1px solid var(--line);font:11.5px var(--mono);color:var(--muted);min-width:0}
.foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.live{color:var(--good)}.live.err{color:var(--warn)}
.foot .rec{flex:1;text-align:center}

/* Réglages */
.sheet{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.card{width:min(620px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;-webkit-user-select:text;user-select:text}
.card h3{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px;margin-bottom:12px}
.fs label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.fs input[type=text],.fs input[type=number],.fs input[type=password],.fs input[type=search],.fs select{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;color:var(--fg);font-size:15px;width:100%}
.fs .ck{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:14px;font-weight:500}
.fs .ck input{width:20px;height:20px}
.res{display:grid;gap:4px;margin-top:4px}
.res button{text-align:left;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel2)}
.res small{color:var(--muted)}

/* Portrait et petits écrans */
@media (orientation:portrait),(max-width:820px){
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .side{border-left:0;border-top:1px solid var(--line)}
  .stats .st:nth-child(n+4){display:none}
  .foot .rec{display:none}
  .legend{display:none}
}
@media (max-width:560px){.clock,.brand span{display:none}}
</style>
</head>
<body>
<div class="shell">

<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.8c.8 0 1.4.8 1.4 1.8v5.3l8.1 4.7v2.2l-8.1-2.3v4.5l2.2 1.7v1.8L12 20.6l-3.6 1v-1.8l2.2-1.7v-4.5l-8.1 2.3v-2.2l8.1-4.7V3.6c0-1 .6-1.8 1.4-1.8z"/></svg>
    <b>Radar</b><span id="where"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="bar-r">
    <div class="clock"><b id="clk">--:--:--</b><br><span id="utc"></span></div>
    <button class="ib" id="bFull" aria-label="Plein écran"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="bSet" aria-label="Réglages"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>
</header>

<main class="work">
  <section class="mapwrap">
    <div id="map"></div>
    <div id="sweep"></div>
    <div class="ov ov-tc" id="alerts"></div>
    <div class="ov ov-tr">
      <button class="ib on" id="bTrail" aria-label="Traînées" title="Traînées"><svg class="i" viewBox="0 0 24 24"><path d="M3 19c5 0 4-9 9-9s4-6 9-6"/><circle cx="20" cy="4" r="1.5"/></svg></button>
      <button class="ib on" id="bLabels" aria-label="Étiquettes" title="Étiquettes"><svg class="i" viewBox="0 0 24 24"><path d="M3 12l5-6h13v12H8z"/></svg></button>
    </div>
    <div class="ov ov-bl">
      <button class="pill accent" id="bHere" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Chercher ici</button>
      <button class="pill" id="bGeo"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Ma position</button>
      <button class="pill" id="bHome"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Maison</button>
    </div>
    <div class="legend" aria-label="Légende des altitudes">
      <div><span>Altitude</span><span id="lgUnit"></span></div>
      <i id="lgBar"></i>
      <div><span id="lg0"></span><span id="lg1"></span><span id="lg2"></span></div>
    </div>
  </section>

  <aside class="side">
    <div class="tools">
      <div class="r1">
        <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Indicatif, immat., hex, type" autocomplete="off" autocapitalize="off" aria-label="Rechercher un avion"></label>
        <select class="sel" id="sort" aria-label="Tri">
          <option value="dist">Distance</option><option value="alt">Altitude</option><option value="spd">Vitesse</option><option value="call">Indicatif</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="detail" id="detail" hidden>
      <div class="dh" id="dHead"></div>
      <figure class="photo" id="dPhoto"></figure>
      <div class="sec" id="dRoute"></div>
      <div class="sec" id="dTele"></div>
      <div class="sec prof" id="dProf"></div>
      <div class="sec" id="dAcars"></div>
      <div class="sec" id="dLinks"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
</main>

<footer class="foot">
  <span id="status"></span>
  <span class="rec" id="records"></span>
  <span id="attr">adsb.lol · airplanes.live · adsbdb · © OpenStreetMap · Esri</span>
</footer>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-label="Réglages">
    <h3>Réglages <button class="ib sm" id="sClose" aria-label="Fermer"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <div class="fs">
      <label style="grid-column:1/-1">Chercher une ville comme position de départ
        <input type="search" id="sCity" placeholder="Nom d'une ville" autocomplete="off">
        <div class="res" id="sRes"></div>
      </label>
      <label>Latitude<input type="number" step="0.0001" id="sLat"></label>
      <label>Longitude<input type="number" step="0.0001" id="sLon"></label>
      <label>Rayon de recherche<select id="sRadius"><option value="25">25 nm</option><option value="50">50 nm</option><option value="100">100 nm</option><option value="150">150 nm</option><option value="250">250 nm (max)</option></select></label>
      <label>Unités<select id="sUnits"><option value="av">Aviation (ft, kt, nm)</option><option value="met">Métrique (m, km/h, km)</option></select></label>
      <label>Actualisation<select id="sRefresh"><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option><option value="15">15 s</option></select></label>
      <label>Thème<select id="sTheme"><option value="auto">Automatique</option><option value="dark">Sombre</option><option value="light">Clair</option></select></label>
      <label>Source des positions<select id="sSource"><option value="auto">Automatique</option><option value="one">adsb.one</option><option value="os">OpenSky</option><option value="lol">adsb.lol</option><option value="apl">airplanes.live</option><option value="fi">adsb.fi</option></select></label>
      <label class="ck"><input type="checkbox" id="sGround"> Masquer les avions au sol</label>
      <label class="ck"><input type="checkbox" id="sAuto"> Utiliser ma position au démarrage</label>
      <label class="ck"><input type="checkbox" id="sExtrap"> Mouvement fluide entre deux mises à jour</label>
      
    </div>
    <p class="note">Les réglages sont enregistrés sur cet appareil.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="sGeo">Utiliser ma position</button><button class="btn accent" id="sDone">Terminé</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const setHTML = (el, h) => { if (el._h !== h){ el.innerHTML = h; el._h = h; } };
const nf = new Intl.NumberFormat('fr-FR');

const DEF = {lat:46.0372, lon:4.0686, radius:100, units:'av', refresh:5, theme:'auto', source:'auto',
  trails:true, labels:true, hideGround:false, extrap:true, autoGeo:true, sort:'dist', filter:'all', key:'', acPoll:30};
let S = Object.assign({}, DEF, store.get('rd.settings', {}));
const save = () => store.set('rd.settings', S);

if (typeof L === 'undefined'){
  document.body.innerHTML = '<p style="padding:24px;font:16px sans-serif">La carte n’a pas pu se charger. Vérifie la connexion puis recharge la page.</p>';
  return;
}

/* ---------- Maths ---------- */
const KT = 0.514444, NM = 1852;
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function hav(a, b, c, d){
  const R = 6371, dl = rad(c - a), dn = rad(d - b);
  const x = Math.sin(dl/2)**2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(dn/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
function brg(a, b, c, d){
  const y = Math.sin(rad(d - b)) * Math.cos(rad(c));
  const x = Math.cos(rad(a)) * Math.sin(rad(c)) - Math.sin(rad(a)) * Math.cos(rad(c)) * Math.cos(rad(d - b));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
function dest(lat, lon, b, m){
  const d = m / 6371000, t = rad(b), p1 = rad(lat), l1 = rad(lon);
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(t));
  const l2 = l1 + Math.atan2(Math.sin(t) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return [deg(p2), ((deg(l2) + 540) % 360) - 180];
}
function gcPts(a, b, n = 48){
  const p1 = rad(a[0]), l1 = rad(a[1]), p2 = rad(b[0]), l2 = rad(b[1]);
  const d = 2 * Math.asin(Math.sqrt(Math.sin((p2-p1)/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin((l2-l1)/2)**2));
  if (!d) return [a, b];
  const out = []; let prev = null;
  for (let i = 0; i <= n; i++){
    const f = i / n, A = Math.sin((1-f)*d) / Math.sin(d), B = Math.sin(f*d) / Math.sin(d);
    const x = A*Math.cos(p1)*Math.cos(l1) + B*Math.cos(p2)*Math.cos(l2);
    const y = A*Math.cos(p1)*Math.sin(l1) + B*Math.cos(p2)*Math.sin(l2);
    const z = A*Math.sin(p1) + B*Math.sin(p2);
    let lat = deg(Math.atan2(z, Math.hypot(x, y))), lon = deg(Math.atan2(y, x));
    if (prev !== null){ while (lon - prev > 180) lon -= 360; while (lon - prev < -180) lon += 360; }
    prev = lon; out.push([lat, lon]);
  }
  return out;
}

/* ---------- Unités ---------- */
const MET = () => S.units === 'met';
const fAlt = (ft, short) => ft == null ? '—' : MET() ? nf.format(Math.round(ft * .3048)) + ' m'
  : (short && ft >= 6000 ? 'FL' + String(Math.round(ft / 100)).padStart(3, '0') : nf.format(Math.round(ft)) + ' ft');
const fSpd = kt => kt == null ? '—' : MET() ? nf.format(Math.round(kt * 1.852)) + ' km/h' : Math.round(kt) + ' kt';
const fDist = km => { if (km == null) return '—'; const v = MET() ? km : km / 1.852; return (v < 10 ? v.toFixed(1) : nf.format(Math.round(v))) + (MET() ? ' km' : ' nm'); };
const fVs = f => f == null ? '—' : MET() ? (f * .00508).toFixed(1) + ' m/s' : nf.format(Math.round(f)) + ' ft/min';
const hhmm = d => d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});

/* ---------- Couleurs d'altitude ---------- */
const STOPS = [[0,[255,107,53]],[2000,[255,182,39]],[5000,[212,225,87]],[10000,[74,222,128]],[20000,[34,211,238]],[30000,[79,140,255]],[40000,[179,107,255]]];
function altRGB(ft){
  if (ft <= 0) return STOPS[0][1];
  for (let i = 1; i < STOPS.length; i++){
    if (ft <= STOPS[i][0]){
      const [a0, c0] = STOPS[i-1], [a1, c1] = STOPS[i], t = (ft - a0) / (a1 - a0);
      return c0.map((v, k) => Math.round(v + (c1[k] - v) * t));
    }
  }
  return STOPS[STOPS.length - 1][1];
}
function altColor(a){
  if (a.ground) return '#8a97a6';
  const v = a.alt ?? a.galt;
  return v == null ? '#8a97a6' : 'rgb(' + altRGB(v) + ')';
}

/* ---------- Référentiels ---------- */
const CAT = {A1:'Léger (< 15 t)', A2:'Petit (15–34 t)', A3:'Grand (34–136 t)', A4:'Grand, turbulence forte', A5:'Gros porteur (> 136 t)', A6:'Haute performance', A7:'Hélicoptère', B1:'Planeur', B2:'Ballon', B3:'Parachutiste', B4:'Ultra-léger', B6:'Drone', B7:'Spatial', C1:'Véhicule de secours', C2:'Véhicule de piste', C3:'Obstacle'};
const SQ = {'7500':'Détournement', '7600':'Panne radio', '7700':'Urgence générale', '7000':'VFR (Europe)', '1200':'VFR (Amérique)'};
const EMG = {general:'Urgence générale', lifeguard:'Urgence médicale', minfuel:'Carburant minimum', nordo:'Panne radio', unlawful:'Acte illicite', downed:'Avion en détresse', reserved:'Urgence'};
const PLANE = 'M12 1.8c.8 0 1.4.8 1.4 1.8v5.3l8.1 4.7v2.2l-8.1-2.3v4.5l2.2 1.7v1.8L12 20.6l-3.6 1v-1.8l2.2-1.7v-4.5l-8.1 2.3v-2.2l8.1-4.7V3.6c0-1 .6-1.8 1.4-1.8z';
const HELI = 'M12 5.5c1.9 0 3 1.4 3 3.2V14c0 1.8-1.1 3.2-3 3.2S9 15.8 9 14V8.7c0-1.8 1.1-3.2 3-3.2zM11 17v4.5h2V17zM8 21.5h8M2.5 6.5l19 6M21.5 6.5l-19 6';

/* ---------- État ---------- */
let ac = new Map(), trails = new Map(), markers = new Map();
let filtered = [], filteredSet = new Set();
let selHex = null, follow = false;
let dc = {lat:S.lat, lon:S.lon}, dr = S.radius;
let lastOk = 0, errMsg = '', busy = false, timer = 0, srcIdx = 0, srcName = '';
const routes = new Map(), infos = new Map(), acars = new Map();

/* ---------- Carte ---------- */
const map = L.map('map', {zoomControl:false, attributionControl:false, preferCanvas:true, zoomSnap:.5, worldCopyJump:true, tap:true});
L.control.zoom({position:'topleft', zoomInText:'+', zoomOutText:'−'}).addTo(map);
const ringLayer = L.layerGroup().addTo(map), trailLayer = L.layerGroup().addTo(map),
      selLayer = L.layerGroup().addTo(map), acLayer = L.layerGroup().addTo(map);
let tiles = null, ahead = null;

function isDark(){ return S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); }
function applyTheme(){
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.dataset.theme = S.theme;
  const dark = isDark();
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dark ? '#070b10' : '#eef1f5';
  if (tiles) map.removeLayer(tiles);
  const web = /^https?:$/.test(location.protocol) && location.hostname !== '';
  tiles = L.tileLayer(web ? 'https://tile.openstreetmap.org/{z}/{x}/{y}.png' : 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19, keepBuffer:4, updateWhenIdle:false, className:dark ? 'tiles-dark' : ''}).addTo(map);
  tiles.setZIndex(1);
  let bad = 0, good = 0;
  tiles.on('tileload', () => { good++; });
  tiles.on('tileerror', () => {
    if (++bad >= 4 && !good && tiles._osm){
      map.removeLayer(tiles);
      tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        {maxZoom:19, keepBuffer:4, className:dark ? 'tiles-dark' : ''}).addTo(map);
      tiles.setZIndex(1);
    }
  });
  tiles._osm = web;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.theme === 'auto') applyTheme(); });

function drawRings(){
  ringLayer.clearLayers();
  const home = [S.lat, S.lon];
  L.marker(home, {icon:L.divIcon({className:'', html:'<div class="home-dot"></div>', iconSize:[12,12], iconAnchor:[6,6]}), interactive:false, keyboard:false}).addTo(ringLayer);
  const col = isDark() ? '#4cc9f0' : '#0a7ea4';
  for (let i = 1; i <= 4; i++){
    L.circle(home, {radius:S.radius * NM * i / 4, color:col, weight:1, opacity:i === 4 ? .45 : .25, fill:false, dashArray:i === 4 ? null : '4 8', interactive:false}).addTo(ringLayer);
  }
  if (Math.abs(dc.lat - S.lat) > 1e-4 || Math.abs(dc.lon - S.lon) > 1e-4){
    L.circle([dc.lat, dc.lon], {radius:dr * NM, color:'#ffb627', weight:1.5, opacity:.6, fill:false, dashArray:'6 6', interactive:false}).addTo(ringLayer);
  }
  placeSweep();
}
function placeSweep(){
  const el = $('#sweep'); if (!el || !map._loaded) return;
  const c = map.latLngToContainerPoint([dc.lat, dc.lon]), e = map.latLngToContainerPoint(dest(dc.lat, dc.lon, 90, dr * NM));
  const r = Math.abs(e.x - c.x);
  if (!isFinite(r) || r < 5){ el.style.display = 'none'; return; }
  el.style.cssText = 'display:block;width:' + (2*r) + 'px;height:' + (2*r) + 'px;left:' + (c.x - r) + 'px;top:' + (c.y - r) + 'px';
}
map.on('move zoom resize viewreset', placeSweep);
function fitZone(){
  map.fitBounds(L.latLng(dc.lat, dc.lon).toBounds(dr * NM * 2.1), {animate:false});
}

/* ---------- Normalisation ---------- */
function norm(o, t){
  const flags = o.dbFlags | 0;
  const ground = o.alt_baro === 'ground';
  return {
    hex:(o.hex || '').toLowerCase(), call:(o.flight || '').trim(), reg:o.r || '', type:o.t || '', desc:o.desc || '', op:o.ownOp || '', year:o.year || '',
    cat:o.category || '', lat:o.lat, lon:o.lon, ground, alt:typeof o.alt_baro === 'number' ? o.alt_baro : null, galt:o.alt_geom ?? null,
    gs:o.gs ?? null, ias:o.ias ?? null, tas:o.tas ?? null, mach:o.mach ?? null,
    trk:o.track ?? o.true_heading ?? o.mag_heading ?? 0, hasTrk:(o.track ?? o.true_heading ?? o.mag_heading) != null,
    thd:o.true_heading ?? null, mhd:o.mag_heading ?? null, roll:o.roll ?? null,
    vs:o.baro_rate ?? o.geom_rate ?? null, sq:o.squawk || '', emerg:o.emergency && o.emergency !== 'none' ? o.emergency : '',
    qnh:o.nav_qnh ?? null, selAlt:o.nav_altitude_mcp ?? o.nav_altitude_fms ?? null, selHdg:o.nav_heading ?? null, modes:o.nav_modes || [],
    wd:o.wd ?? null, ws:o.ws ?? null, oat:o.oat ?? null, tat:o.tat ?? null, rssi:o.rssi ?? null, seen:o.seen ?? null,
    msgs:o.messages ?? null, nic:o.nic ?? null, nacp:o.nac_p ?? null, sil:o.sil ?? null,
    mil:!!(flags & 1), intr:!!(flags & 2), pia:!!(flags & 4), ladd:!!(flags & 8),
    t0:t - (o.seen_pos || 0) * 1000, lost:false
  };
}
const isEmerg = a => ['7500','7600','7700'].includes(a.sq) || !!a.emerg;
const validCall = c => /^[A-Z]{3}\d{1,4}[A-Z]{0,2}$/.test(c || '');

function curPos(a){
  if (!S.extrap || a.ground || !a.hasTrk || !(a.gs > 30)) return [a.lat, a.lon];
  const dt = Math.min(25, Math.max(0, (Date.now() - a.t0) / 1000)), d = a.gs * KT * dt;
  return [a.lat + d * Math.cos(rad(a.trk)) / 111320, a.lon + d * Math.sin(rad(a.trk)) / (111320 * Math.max(.2, Math.cos(rad(a.lat))))];
}

/* ---------- Réseau : positions ---------- */
const SOURCES = [
  {id:'one', name:'adsb.one', url:(la, lo, r) => 'https://api.adsb.one/v2/point/' + la + '/' + lo + '/' + r},
  {id:'px3', name:'adsb.lol (relais 3)', url:(la, lo, r) => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent('https://api.adsb.lol/v2/point/' + la + '/' + lo + '/' + r)},
  {id:'px4', name:'adsb.lol (relais 4)', url:(la, lo, r) => 'https://thingproxy.freeboard.io/fetch/https://api.adsb.lol/v2/point/' + la + '/' + lo + '/' + r},
  {id:'px1', name:'adsb.lol (relais 1)', url:(la, lo, r) => 'https://corsproxy.io/?url=' + encodeURIComponent('https://api.adsb.lol/v2/point/' + la + '/' + lo + '/' + r)},
  {id:'px2', name:'adsb.lol (relais 2)', url:(la, lo, r) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://api.adsb.lol/v2/point/' + la + '/' + lo + '/' + r)},
  {id:'os', name:'OpenSky', url:(la, lo, r) => { const dl = r * 1.852 / 111.32, dn = dl / Math.max(.2, Math.cos(rad(+la)));
      return 'https://opensky-network.org/api/states/all?lamin=' + (la - dl).toFixed(3) + '&lamax=' + (+la + dl).toFixed(3) + '&lomin=' + (lo - dn).toFixed(3) + '&lomax=' + (+lo + dn).toFixed(3); },
    parse:j => (j.states || []).map(x => ({hex:x[0], flight:x[1], lon:x[5], lat:x[6], alt_baro:x[8] ? 'ground' : (x[7] != null ? x[7] / .3048 : undefined),
      alt_geom:x[13] != null ? x[13] / .3048 : undefined, gs:x[9] != null ? x[9] / KT : undefined, track:x[10] ?? undefined,
      baro_rate:x[11] != null ? x[11] * 196.85 : undefined, squawk:x[14] || undefined, category:x[17] ? ['','','A1','A2','A3','A4','A5','A6','A7','B1','B2','B3','B4','B6','B7','C1','C2'][x[17]] : undefined, seen_pos:0}))},
  {id:'lol', name:'adsb.lol', url:(la, lo, r) => 'https://api.adsb.lol/v2/point/' + la + '/' + lo + '/' + r},
  {id:'apl', name:'airplanes.live', url:(la, lo, r) => 'https://api.airplanes.live/v2/point/' + la + '/' + lo + '/' + r},
  {id:'fi', name:'adsb.fi', url:(la, lo, r) => 'https://opendata.adsb.fi/api/v3/lat/' + la + '/lon/' + lo + '/dist/' + r}
];
SOURCES.sort((a, b) => (a.id[0] === 'p') - (b.id[0] === 'p'));
function sigTimeout(ms){
  if (AbortSignal.timeout) return AbortSignal.timeout(ms);
  const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal;
}
async function poll(){
  if (busy) return; busy = true;
  const order = S.source === 'auto' ? SOURCES.map((_, i) => SOURCES[(srcIdx + i) % SOURCES.length]) : [SOURCES.find(s => s.id === S.source) || SOURCES[0]];
  let ok = false, lastErr = '', errs = [];
  for (const src of order){
    try {
      const res = await fetch(src.url(dc.lat.toFixed(4), dc.lon.toFixed(4), Math.min(250, Math.round(dr))), {signal:sigTimeout(9000)});
      if (res.status === 429) throw new Error('Trop de requêtes (429)');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      ingest(src.parse ? src.parse(j) : (j.ac || j.aircraft || []));
      srcName = src.name; lastOk = Date.now(); ok = true;
      if (S.source === 'auto') srcIdx = SOURCES.indexOf(src);
      break;
    } catch(e){
      lastErr = (e.name === 'TimeoutError' || e.name === 'AbortError') ? 'délai dépassé' : (e instanceof TypeError ? 'bloqué ou erreur : ' + e.message : e.message);
      errs.push(src.name + ' : ' + lastErr);
    }
  }
  errMsg = ok ? '' : errs.join(' | ');
  busy = false;
  renderAll();
  schedule();
}
function schedule(){
  clearTimeout(timer);
  if (document.hidden) return;
  timer = setTimeout(poll, Math.max(1500, S.refresh * 1000));
}
function ingest(list){
  const t = Date.now(), next = new Map();
  for (const o of list){
    if (typeof o.lat !== 'number' || typeof o.lon !== 'number') continue;
    const a = norm(o, t); if (!a.hex) continue;
    a.dist = hav(S.lat, S.lon, a.lat, a.lon); a.brg = brg(S.lat, S.lon, a.lat, a.lon);
    const prev = ac.get(a.hex); a.first = prev ? prev.first : t;
    next.set(a.hex, a); pushTrail(a);
  }
  const keep = ac.get(selHex);
  if (keep && !next.has(selHex) && t - keep.t0 < 120000){ keep.lost = true; next.set(selHex, keep); }
  ac = next;
  for (const [h, tr] of trails){
    if (!ac.has(h) && t - tr.upd > 120000){ if (tr.line) trailLayer.removeLayer(tr.line); trails.delete(h); }
  }
}
function pushTrail(a){
  let tr = trails.get(a.hex);
  if (!tr){ tr = {pts:[], line:null, upd:0}; trails.set(a.hex, tr); }
  const l = tr.pts[tr.pts.length - 1];
  if (!l || l[0] !== a.lat || l[1] !== a.lon){
    tr.pts.push([a.lat, a.lon, a.alt ?? a.galt ?? 0, a.t0]);
    if (tr.pts.length > 160) tr.pts.shift();
  }
  tr.upd = Date.now();
}

/* ---------- Réseau : trajets, fiches, ACARS ---------- */
function parseRoute(j){
  const fr = j && j.response && j.response.flightroute; if (!fr) return null;
  const ap = x => x ? {iata:x.iata_code || '', icao:x.icao_code || '', name:x.name || '', city:x.municipality || '', lat:x.latitude, lon:x.longitude} : null;
  return {o:ap(fr.origin), d:ap(fr.destination), airline:fr.airline ? {name:fr.airline.name || '', iata:fr.airline.iata || '', icao:fr.airline.icao || ''} : null, ciata:fr.callsign_iata || ''};
}
async function loadRoute(call){
  try {
    const res = await fetch('https://api.adsbdb.com/v0/callsign/' + encodeURIComponent(call), {signal:sigTimeout(8000)});
    if (res.status === 404){ routes.set(call, {s:'none', t:Date.now()}); return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const r = parseRoute(await res.json());
    routes.set(call, r && r.o && r.d ? {s:'ok', d:r, t:Date.now()} : {s:'none', t:Date.now()});
  } catch(e){ routes.set(call, {s:'err', t:Date.now()}); }
}
let routeBusy = false;
async function pumpRoutes(){
  if (routeBusy || document.hidden) return;
  const want = []; const s = ac.get(selHex); if (s) want.push(s);
  for (const a of filtered.slice(0, 30)) want.push(a);
  for (const a of want){
    if (!validCall(a.call)) continue;
    const c = routes.get(a.call);
    if (c && (c.s === 'ok' || c.s === 'none')) continue;
    if (c && c.s === 'err' && Date.now() - c.t < 60000) continue;
    routeBusy = true; await loadRoute(a.call); routeBusy = false;
    renderList(); renderDetail(); drawSel();
    return;
  }
}
async function loadInfo(hex){
  if (infos.has(hex)) return;
  infos.set(hex, {s:'load'});
  try {
    const res = await fetch('https://api.adsbdb.com/v0/aircraft/' + hex, {signal:sigTimeout(8000)});
    if (res.status === 404){ infos.set(hex, {s:'none'}); }
    else if (!res.ok) throw new Error('HTTP ' + res.status);
    else {
      const j = await res.json(), x = j.response && j.response.aircraft;
      infos.set(hex, x ? {s:'ok', d:x} : {s:'none'});
    }
  } catch(e){ infos.set(hex, {s:'err'}); setTimeout(() => { if (infos.get(hex) && infos.get(hex).s === 'err') infos.delete(hex); }, 30000); }
  if (selHex === hex) renderDetail();
}

  renderAll();
  const row = document.querySelector('.row[data-h="' + h + '"]'); if (row) row.scrollIntoView({block:'nearest'});
  const p = curPos(a); if (!map.getBounds().pad(-.15).contains(p)) map.panTo(p, {animate:true});
}
function deselect(){ selHex = null; follow = false; selLayer.clearLayers(); ahead = null; renderAll(); }

/* ---------- Rendu global ---------- */
function renderAll(){
  computeFiltered();
  renderStats(); renderAlerts(); renderList(); renderDetail(); syncMap(); drawSel(); renderStatus();
}

/* ---------- Boucle 1 s ---------- */
function tick(){
  const n = new Date();
  $('#clk').textContent = n.toLocaleTimeString('fr-FR');
  $('#utc').textContent = n.toISOString().slice(11, 16) + ' UTC';
  renderStatus();
  if (selHex && S.key){ const a = ac.get(selHex); if (a) loadAcars(a, false); }
}

function move(){
  if (!document.hidden && S.extrap){
    for (const [h, m] of markers){ const a = ac.get(h); if (a) m.setLatLng(curPos(a)); }
    const a = ac.get(selHex);
    if (a){
      const p = curPos(a);
      if (ahead && a.hasTrk) ahead.setLatLngs([p, dest(p[0], p[1], a.trk, a.gs * KT * 300)]);
      if (follow) map.panTo(p, {animate:true, duration:1, easeLinearity:1});
    }
  } else if (follow){ const a = ac.get(selHex); if (a) map.panTo(curPos(a), {animate:true}); }
}
/* ---------- Zone de recherche ---------- */
function updateHere(){
  const c = map.getCenter();
  $('#bHere').hidden = hav(c.lat, c.lng, dc.lat, dc.lon) < dr * 1.852 * .35;
}
map.on('moveend', updateHere);
map.on('dragstart', () => { if (follow){ follow = false; renderDetail(); } });
map.on('click', () => { if (selHex) deselect(); });
map.on('zoomend', () => $('#map').classList.toggle('labels', S.labels && map.getZoom() >= 9));
$('#bHere').addEventListener('click', () => {
  const c = map.getCenter(), ne = map.getBounds().getNorthEast();
  dc = {lat:+c.lat.toFixed(4), lon:+c.lng.toFixed(4)};
  dr = Math.max(25, Math.min(250, Math.round(hav(c.lat, c.lng, ne.lat, ne.lng) / 1.852 * 1.08)));
  $('#bHere').hidden = true; drawRings(); poll();
});
$('#bHome').addEventListener('click', () => {
  dc = {lat:S.lat, lon:S.lon}; dr = S.radius; drawRings(); fitZone(); $('#bHere').hidden = true; poll();
});

/* ---------- Événements ---------- */
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  S.filter = b.dataset.f; save(); renderChips(); renderAll();
});
$('#sort').addEventListener('change', e => { S.sort = e.target.value; save(); renderAll(); });
$('#q').addEventListener('input', e => { query = e.target.value.trim(); renderAll(); });
$('#list').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b) select(b.dataset.h); });
$('#alerts').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b) select(b.dataset.h); });
$('#detail').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'close') deselect();
  else if (b.dataset.act === 'follow'){ follow = !follow; if (follow){ const a = ac.get(selHex); if (a) map.panTo(curPos(a)); } renderDetail(); }
  else if (b.dataset.act === 'settings') openSheet();
});
function setToggle(id, key){
  const b = $(id); b.classList.toggle('on', !!S[key]);
  b.addEventListener('click', () => { S[key] = !S[key]; save(); b.classList.toggle('on', S[key]); map.fire('zoomend'); renderAll(); });
}
setToggle('#bTrail', 'trails'); setToggle('#bLabels', 'labels');

$('#bFull').addEventListener('click', () => {
  const d = document, r = d.documentElement;
  const on = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if (on) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (r.requestFullscreen) r.requestFullscreen().catch(() => hintFull());
    else if (r.webkitRequestFullscreen) r.webkitRequestFullscreen();
    else hintFull();
  } catch(e){ hintFull(); }
});
function hintFull(){ errMsg = 'Plein écran : dans Safari, Partager > Sur l’écran d’accueil, puis ouvre l’icône.'; renderStatus(); setTimeout(() => { errMsg = ''; }, 6000); }

/* ---------- Réglages ---------- */
function fillSheet(){
  $('#sLat').value = S.lat; $('#sLon').value = S.lon; $('#sRadius').value = String(S.radius); $('#sUnits').value = S.units;
  $('#sRefresh').value = String(S.refresh); $('#sTheme').value = S.theme; $('#sSource').value = S.source;
  $('#sGround').checked = S.hideGround; $('#sExtrap').checked = S.extrap; $('#sAuto').checked = S.autoGeo;
}
function openSheet(){ fillSheet(); $('#sheet').hidden = false; }
function closeSheet(){ $('#sheet').hidden = true; }
$('#bSet').addEventListener('click', openSheet);
$('#sClose').addEventListener('click', closeSheet); $('#sDone').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
function recenter(){
  dc = {lat:S.lat, lon:S.lon}; dr = S.radius;
  for (const a of ac.values()){ a.dist = hav(S.lat, S.lon, a.lat, a.lon); a.brg = brg(S.lat, S.lon, a.lat, a.lon); }
  drawRings(); fitZone(); poll();
}
const bind = (id, fn) => $(id).addEventListener('change', fn);
bind('#sLat', e => { const v = parseFloat(e.target.value); if (isFinite(v) && v >= -90 && v <= 90){ S.lat = v; save(); recenter(); } });
bind('#sLon', e => { const v = parseFloat(e.target.value); if (isFinite(v) && v >= -180 && v <= 180){ S.lon = v; save(); recenter(); } });
bind('#sRadius', e => { S.radius = +e.target.value; save(); recenter(); });
bind('#sUnits', e => { S.units = e.target.value; save(); buildLegend(); renderAll(); });
bind('#sRefresh', e => { S.refresh = +e.target.value; save(); schedule(); });
bind('#sTheme', e => { S.theme = e.target.value; save(); applyTheme(); drawRings(); renderAll(); });
bind('#sSource', e => { S.source = e.target.value; save(); poll(); });
bind('#sGround', e => { S.hideGround = e.target.checked; save(); renderAll(); });
bind('#sAuto', e => { S.autoGeo = e.target.checked; save(); });
bind('#sExtrap', e => { S.extrap = e.target.checked; save(); });
function useGeo(manual){
  if (!navigator.geolocation){ if (manual) msg('Position indisponible sur cet appareil.'); return; }
  navigator.geolocation.getCurrentPosition(p => {
    const la = +p.coords.latitude.toFixed(4), lo = +p.coords.longitude.toFixed(4);
    if (manual || hav(la, lo, S.lat, S.lon) > 1){ S.lat = la; S.lon = lo; save(); fillSheet(); recenter(); }
  }, () => { if (manual) msg('Position refusée. Autorise-la dans Réglages > Safari > Position.'); }, {timeout:10000, maximumAge:600000});
}
function msg(t){ errMsg = t; renderStatus(); setTimeout(() => { errMsg = ''; renderStatus(); }, 6000); }
$('#sGeo').addEventListener('click', () => useGeo(true));
$('#bGeo').addEventListener('click', () => useGeo(true));
let cTimer = 0, cSeq = 0;
$('#sCity').addEventListener('input', e => {
  clearTimeout(cTimer); const q = e.target.value.trim();
  if (q.length < 2){ $('#sRes').innerHTML = ''; return; }
  cTimer = setTimeout(async () => {
    const my = ++cSeq;
    try {
      const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q) + '&count=5&language=fr&format=json', {signal:sigTimeout(8000)});
      const j = await res.json(); if (my !== cSeq) return;
      const list = j.results || [];
      $('#sRes').innerHTML = list.length ? list.map((x, i) => '<button data-i="' + i + '">' + esc(x.name) + ' <small>' + esc([x.admin1, x.country].filter(Boolean).join(', ')) + '</small></button>').join('') : '<small>Aucune ville trouvée.</small>';
      $('#sRes').onclick = ev => {
        const b = ev.target.closest('[data-i]'); if (!b) return; const x = list[+b.dataset.i];
        S.lat = +x.latitude.toFixed(4); S.lon = +x.longitude.toFixed(4); save(); fillSheet(); $('#sRes').innerHTML = ''; $('#sCity').value = ''; recenter();
      };
    } catch(err){ $('#sRes').innerHTML = '<small>Recherche impossible pour le moment.</small>'; }
  }, 300);
});

/* ---------- Légende ---------- */
function buildLegend(){
  $('#lgBar').style.background = 'linear-gradient(90deg,' + STOPS.map(([a, c]) => 'rgb(' + c + ') ' + (a / 400) + '%').join(',') + ')';
  $('#lgUnit').textContent = MET() ? 'm' : 'ft';
  const f = v => MET() ? nf.format(Math.round(v * .3048 / 100) * 100) : nf.format(v);
  $('#lg0').textContent = '0'; $('#lg1').textContent = f(20000); $('#lg2').textContent = f(40000);
}

/* ---------- Veille écran et visibilité ---------- */
let wl = null;
async function wake(){ try { if ('wakeLock' in navigator && !wl){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch(e){ wl = null; } }
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ clearTimeout(timer); return; }
  wake(); if (Date.now() - lastOk > S.refresh * 1000) poll(); else schedule();
});
document.addEventListener('pointerdown', () => { if (!wl) wake(); }, {passive:true});
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- Démarrage ---------- */
$('#sort').value = S.sort;
applyTheme(); buildLegend(); renderChips(); drawRings(); fitZone();
$('#map').classList.toggle('labels', S.labels && map.getZoom() >= 9);
window.addEventListener('resize', () => map.invalidateSize());
new ResizeObserver(() => map.invalidateSize()).observe($('#map'));
tick(); setInterval(tick, 1000); setInterval(move, 200);
setInterval(pumpRoutes, 1200);
renderAll(); poll(); wake();
if (S.autoGeo) useGeo(false);
})();
</script>
</body>
</html>
